name: Trae Auto Checkin

on:
  schedule:
    - cron: "0 * * * *"          # 每小时（自动轮签 1 个账号）
  workflow_dispatch:
    inputs:
      job_index:
        description: "account index to checkin (1-N); empty = rotate by hour"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Compute account index
        id: idx
        run: |
          JI="${{ github.event.inputs.job_index }}"
          if [ -z "$JI" ]; then
            H=$(date -u +%H)
            JI=$(( 10#$H % 5 + 1 ))
          fi
          echo "JOB_INDEX=$JI" >> "$GITHUB_ENV"
          echo "checkin account index = $JI"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checkin
        env:
          JOB_INDEX: ${{ env.JOB_INDEX }}
          TRAE_REFRESH_TOKEN: ${{ secrets.TRAE_REFRESH_TOKEN }}
          TRAE_REFRESH_TOKEN_2: ${{ secrets.TRAE_REFRESH_TOKEN_2 }}
          TRAE_REFRESH_TOKEN_3: ${{ secrets.TRAE_REFRESH_TOKEN_3 }}
          TRAE_REFRESH_TOKEN_4: ${{ secrets.TRAE_REFRESH_TOKEN_4 }}
          TRAE_REFRESH_TOKEN_5: ${{ secrets.TRAE_REFRESH_TOKEN_5 }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
        run: python trae_auto_checkin.py
